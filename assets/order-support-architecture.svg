<svg xmlns="http://www.w3.org/2000/svg" width="1002" height="420" viewBox="0 0 1002 420" role="img" aria-labelledby="title desc">
  <title id="title">Order and shipment support architecture</title>
  <desc id="desc">Chat trigger flows to Disabled decrypt step. Disabled decrypt step flows to Mock identity → agent. Order lookup tool attaches to Mock identity → agent. Order lookup tool flows to Find customer → orders. Find customer → orders flows to Tracking present?. Tracking present? flows to DHL lookup. DHL lookup flows to Merge → tool response. Tracking present? flows to Merge → tool response. Find customer → orders flows to Missing input or match.</desc>
  <rect width="1002" height="420" rx="18" fill="#0B1220"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#F59A2C"/></marker>
    <marker id="toolArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A7B9D1"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
    <text x="24" y="38" font-size="23" font-weight="700" fill="#F1F5FD">Order and shipment support</text>
    <text x="24" y="62" font-size="13" fill="#A7B9D1">Simplified architecture from static template review</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M182 122C202 122 202 122 222 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M380 122C400 122 400 122 420 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M380 221C400 221 400 122 420 122" stroke="#A7B9D1" stroke-dasharray="4 4" marker-end="url(#toolArrow)"/>
    <path d="M380 221C400 221 400 221 420 221" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M578 221C598 221 598 221 618 221" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M776 221C796 221 796 221 816 221" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M895 253V288" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M776 221C796 221 796 320 816 320" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M499 253V288" stroke="#F59A2C" marker-end="url(#arrow)"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#F1F5FD">
    <rect x="24" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="103" y="127" text-anchor="middle"><tspan x="103" dy="0">Chat trigger</tspan></text>
    <rect x="222" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="301" y="119" text-anchor="middle"><tspan x="301" dy="0">Disabled decrypt</tspan><tspan x="301" dy="16">step</tspan></text>
    <rect x="420" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="499" y="119" text-anchor="middle"><tspan x="499" dy="0">Mock identity →</tspan><tspan x="499" dy="16">agent</tspan></text>
    <rect x="222" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="301" y="226" text-anchor="middle"><tspan x="301" dy="0">Order lookup tool</tspan></text>
    <rect x="420" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="499" y="218" text-anchor="middle"><tspan x="499" dy="0">Find customer →</tspan><tspan x="499" dy="16">orders</tspan></text>
    <rect x="618" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="697" y="226" text-anchor="middle"><tspan x="697" dy="0">Tracking present?</tspan></text>
    <rect x="816" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="895" y="226" text-anchor="middle"><tspan x="895" dy="0">DHL lookup</tspan></text>
    <rect x="816" y="288" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="895" y="317" text-anchor="middle"><tspan x="895" dy="0">Merge → tool</tspan><tspan x="895" dy="16">response</tspan></text>
    <rect x="420" y="288" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="499" y="317" text-anchor="middle"><tspan x="499" dy="0">Missing input or</tspan><tspan x="499" dy="16">match</tspan></text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#A7B9D1">
    <path d="M24 400h26" stroke="#F59A2C" stroke-width="2"/><text x="59" y="404">Processing flow</text>
    <path d="M185 400h26" stroke="#A7B9D1" stroke-width="2" stroke-dasharray="4 4"/><text x="220" y="404">Tool or AI resource</text>
  </g>
</svg>
