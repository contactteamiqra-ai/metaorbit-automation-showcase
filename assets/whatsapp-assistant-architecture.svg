<svg xmlns="http://www.w3.org/2000/svg" width="760" height="618" viewBox="0 0 760 618" role="img" aria-labelledby="title desc">
  <title id="title">WhatsApp assistant architecture</title>
  <desc id="desc">Verify webhook flows to Return challenge. Message webhook flows to Check for message. Check for message flows to AI reply → WhatsApp. Check for message flows to Text-only notice. Manual ingestion flows to Refresh → Drive download. Refresh → Drive download flows to Embed → Qdrant insert. Manual ingestion flows to Create collection.</desc>
  <rect width="760" height="618" rx="18" fill="#0B1220"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#F59A2C"/></marker>
    <marker id="toolArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A7B9D1"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
    <text x="24" y="38" font-size="23" font-weight="700" fill="#F1F5FD">WhatsApp assistant</text>
    <text x="24" y="62" font-size="13" fill="#A7B9D1">Simplified architecture from static template review</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M182 122C202 122 202 122 222 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M182 221C202 221 202 221 222 221" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M380 221C400 221 400 221 420 221" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M380 221C400 221 400 320 420 320" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M182 419C202 419 202 419 222 419" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M380 419C400 419 400 419 420 419" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M182 419C202 419 202 518 222 518" stroke="#F59A2C" marker-end="url(#arrow)"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#F1F5FD">
    <rect x="24" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="103" y="127" text-anchor="middle"><tspan x="103" dy="0">Verify webhook</tspan></text>
    <rect x="222" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="301" y="127" text-anchor="middle"><tspan x="301" dy="0">Return challenge</tspan></text>
    <rect x="24" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="103" y="226" text-anchor="middle"><tspan x="103" dy="0">Message webhook</tspan></text>
    <rect x="222" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="301" y="226" text-anchor="middle"><tspan x="301" dy="0">Check for message</tspan></text>
    <rect x="420" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="499" y="226" text-anchor="middle"><tspan x="499" dy="0">AI reply → WhatsApp</tspan></text>
    <rect x="420" y="288" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="499" y="325" text-anchor="middle"><tspan x="499" dy="0">Text-only notice</tspan></text>
    <rect x="24" y="387" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="103" y="424" text-anchor="middle"><tspan x="103" dy="0">Manual ingestion</tspan></text>
    <rect x="222" y="387" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="301" y="416" text-anchor="middle"><tspan x="301" dy="0">Refresh → Drive</tspan><tspan x="301" dy="16">download</tspan></text>
    <rect x="420" y="387" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="499" y="416" text-anchor="middle"><tspan x="499" dy="0">Embed → Qdrant</tspan><tspan x="499" dy="16">insert</tspan></text>
    <rect x="222" y="486" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="301" y="523" text-anchor="middle"><tspan x="301" dy="0">Create collection</tspan></text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#A7B9D1">
    <path d="M24 598h26" stroke="#F59A2C" stroke-width="2"/><text x="59" y="602">Processing flow</text>
  </g>
</svg>
