<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Support ticket triage architecture</title>
  <desc id="desc">Schedule → aged Jira issues flows to Run per issue → read thread. Run per issue → read thread flows to Classify issue state. Classify issue state flows to Sentiment → feedback or close. Classify issue state flows to Check last message → reminder. Classify issue state flows to Knowledge search. Knowledge search flows to Solution?. Solution? flows to Reply → close. Solution? flows to Slack alert → reply → close.</desc>
  <rect width="1200" height="420" rx="18" fill="#0B1220"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#F59A2C"/></marker>
    <marker id="toolArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A7B9D1"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
    <text x="24" y="38" font-size="23" font-weight="700" fill="#F1F5FD">Support ticket triage</text>
    <text x="24" y="62" font-size="13" fill="#A7B9D1">Simplified architecture from static template review</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M182 221C202 221 202 221 222 221" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M380 221C400 221 400 221 420 221" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M578 221C598 221 598 122 618 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M578 221C598 221 598 221 618 221" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M578 221C598 221 598 320 618 320" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M776 320C796 320 796 320 816 320" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M974 320C994 320 994 221 1014 221" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M974 320C994 320 994 320 1014 320" stroke="#F59A2C" marker-end="url(#arrow)"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#F1F5FD">
    <rect x="24" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="103" y="218" text-anchor="middle"><tspan x="103" dy="0">Schedule → aged</tspan><tspan x="103" dy="16">Jira issues</tspan></text>
    <rect x="222" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="301" y="218" text-anchor="middle"><tspan x="301" dy="0">Run per issue →</tspan><tspan x="301" dy="16">read thread</tspan></text>
    <rect x="420" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="499" y="218" text-anchor="middle"><tspan x="499" dy="0">Classify issue</tspan><tspan x="499" dy="16">state</tspan></text>
    <rect x="618" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="697" y="119" text-anchor="middle"><tspan x="697" dy="0">Sentiment →</tspan><tspan x="697" dy="16">feedback or close</tspan></text>
    <rect x="618" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="697" y="218" text-anchor="middle"><tspan x="697" dy="0">Check last message</tspan><tspan x="697" dy="16">→ reminder</tspan></text>
    <rect x="618" y="288" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="697" y="325" text-anchor="middle"><tspan x="697" dy="0">Knowledge search</tspan></text>
    <rect x="816" y="288" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="895" y="325" text-anchor="middle"><tspan x="895" dy="0">Solution?</tspan></text>
    <rect x="1014" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="1093" y="226" text-anchor="middle"><tspan x="1093" dy="0">Reply → close</tspan></text>
    <rect x="1014" y="288" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="1093" y="317" text-anchor="middle"><tspan x="1093" dy="0">Slack alert → reply</tspan><tspan x="1093" dy="16">→ close</tspan></text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#A7B9D1">
    <path d="M24 400h26" stroke="#F59A2C" stroke-width="2"/><text x="59" y="404">Processing flow</text>
  </g>
</svg>
