<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="321" viewBox="0 0 1200 321" role="img" aria-labelledby="title desc">
  <title id="title">Weekly analytics reporting architecture</title>
  <desc id="desc">Weekly schedule flows to Current GA4 → summarize. Current GA4 → summarize flows to Build prior-year window. Build prior-year window flows to Prior GA4 → summarize. Prior GA4 → summarize flows to Draft comparison. Draft comparison flows to Send HTML email. Draft comparison flows to Reformat → Telegram.</desc>
  <rect width="1200" height="321" rx="18" fill="#0B1220"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#F59A2C"/></marker>
    <marker id="toolArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A7B9D1"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
    <text x="24" y="38" font-size="23" font-weight="700" fill="#F1F5FD">Weekly analytics reporting</text>
    <text x="24" y="62" font-size="13" fill="#A7B9D1">Simplified architecture from static template review</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M182 122C202 122 202 122 222 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M380 122C400 122 400 122 420 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M578 122C598 122 598 122 618 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M776 122C796 122 796 122 816 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M974 122C994 122 994 122 1014 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M974 122C994 122 994 221 1014 221" stroke="#F59A2C" marker-end="url(#arrow)"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#F1F5FD">
    <rect x="24" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="103" y="127" text-anchor="middle"><tspan x="103" dy="0">Weekly schedule</tspan></text>
    <rect x="222" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="301" y="119" text-anchor="middle"><tspan x="301" dy="0">Current GA4 →</tspan><tspan x="301" dy="16">summarize</tspan></text>
    <rect x="420" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="499" y="119" text-anchor="middle"><tspan x="499" dy="0">Build prior-year</tspan><tspan x="499" dy="16">window</tspan></text>
    <rect x="618" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="697" y="119" text-anchor="middle"><tspan x="697" dy="0">Prior GA4 →</tspan><tspan x="697" dy="16">summarize</tspan></text>
    <rect x="816" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="895" y="127" text-anchor="middle"><tspan x="895" dy="0">Draft comparison</tspan></text>
    <rect x="1014" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="1093" y="127" text-anchor="middle"><tspan x="1093" dy="0">Send HTML email</tspan></text>
    <rect x="1014" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="1093" y="226" text-anchor="middle"><tspan x="1093" dy="0">Reformat → Telegram</tspan></text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#A7B9D1">
    <path d="M24 301h26" stroke="#F59A2C" stroke-width="2"/><text x="59" y="305">Processing flow</text>
  </g>
</svg>
