<svg xmlns="http://www.w3.org/2000/svg" width="804" height="321" viewBox="0 0 804 321" role="img" aria-labelledby="title desc">
  <title id="title">Instagram DM assistant architecture</title>
  <desc id="desc">ManyChat webhook flows to Set persona. Set persona flows to AI agent. AI agent flows to Return webhook reply. OpenAI model attaches to AI agent. Session memory attaches to AI agent.</desc>
  <rect width="804" height="321" rx="18" fill="#0B1220"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#F59A2C"/></marker>
    <marker id="toolArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A7B9D1"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
    <text x="24" y="38" font-size="23" font-weight="700" fill="#F1F5FD">Instagram DM assistant</text>
    <text x="24" y="62" font-size="13" fill="#A7B9D1">Simplified architecture from static template review</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M182 122C202 122 202 122 222 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M380 122C400 122 400 122 420 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M578 122C598 122 598 122 618 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M380 221C400 221 400 122 420 122" stroke="#A7B9D1" stroke-dasharray="4 4" marker-end="url(#toolArrow)"/>
    <path d="M499 189V154" stroke="#A7B9D1" stroke-dasharray="4 4" marker-end="url(#toolArrow)"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#F1F5FD">
    <rect x="24" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="103" y="127" text-anchor="middle"><tspan x="103" dy="0">ManyChat webhook</tspan></text>
    <rect x="222" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="301" y="127" text-anchor="middle"><tspan x="301" dy="0">Set persona</tspan></text>
    <rect x="420" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="499" y="127" text-anchor="middle"><tspan x="499" dy="0">AI agent</tspan></text>
    <rect x="618" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="697" y="119" text-anchor="middle"><tspan x="697" dy="0">Return webhook</tspan><tspan x="697" dy="16">reply</tspan></text>
    <rect x="222" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="301" y="226" text-anchor="middle"><tspan x="301" dy="0">OpenAI model</tspan></text>
    <rect x="420" y="189" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="499" y="226" text-anchor="middle"><tspan x="499" dy="0">Session memory</tspan></text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#A7B9D1">
    <path d="M24 301h26" stroke="#F59A2C" stroke-width="2"/><text x="59" y="305">Processing flow</text>
    <path d="M185 301h26" stroke="#A7B9D1" stroke-width="2" stroke-dasharray="4 4"/><text x="220" y="305">Tool or AI resource</text>
  </g>
</svg>
