<svg xmlns="http://www.w3.org/2000/svg" width="1002" height="222" viewBox="0 0 1002 222" role="img" aria-labelledby="title desc">
  <title id="title">Lead qualification architecture</title>
  <desc id="desc">New sheet row flows to OpenAI rating. OpenAI rating flows to Parse JSON. Parse JSON flows to Merge source + rating. New sheet row flows to Merge source + rating. Merge source + rating flows to Update Rating.</desc>
  <rect width="1002" height="222" rx="18" fill="#0B1220"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#F59A2C"/></marker>
    <marker id="toolArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A7B9D1"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif">
    <text x="24" y="38" font-size="23" font-weight="700" fill="#F1F5FD">Lead qualification</text>
    <text x="24" y="62" font-size="13" fill="#A7B9D1">Simplified architecture from static template review</text>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M182 122C202 122 202 122 222 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M380 122C400 122 400 122 420 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M578 122C598 122 598 122 618 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M103 90V75H697V90" stroke="#F59A2C" marker-end="url(#arrow)"/>
    <path d="M776 122C796 122 796 122 816 122" stroke="#F59A2C" marker-end="url(#arrow)"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#F1F5FD">
    <rect x="24" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="103" y="127" text-anchor="middle"><tspan x="103" dy="0">New sheet row</tspan></text>
    <rect x="222" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="301" y="127" text-anchor="middle"><tspan x="301" dy="0">OpenAI rating</tspan></text>
    <rect x="420" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="499" y="127" text-anchor="middle"><tspan x="499" dy="0">Parse JSON</tspan></text>
    <rect x="618" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="697" y="119" text-anchor="middle"><tspan x="697" dy="0">Merge source +</tspan><tspan x="697" dy="16">rating</tspan></text>
    <rect x="816" y="90" width="158" height="64" rx="10" fill="#16233A" stroke="#3E526F"/>
    <text x="895" y="127" text-anchor="middle"><tspan x="895" dy="0">Update Rating</tspan></text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#A7B9D1">
    <path d="M24 202h26" stroke="#F59A2C" stroke-width="2"/><text x="59" y="206">Processing flow</text>
  </g>
</svg>
